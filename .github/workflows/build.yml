


name: Build and Test (Docker Compose)

on:
  push:
    branches: [ "dev", "main", "feat/*" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: micro-banking-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Maven modules
        run: |
          cd app
          for dir in gateway-service nickname-service infra/protos; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Building $dir..."
              (cd $dir && mvn -B clean package)
            fi
          done

      - name: Build and run Docker Compose
        run: |
          cd app/infra
          docker-compose build
          docker-compose up -d
          docker ps -a

      - name: Wait for services
        run: sleep 15

      - name: Test services health
        run: |
          curl -v http://localhost:8080 || true
          curl -v http://localhost:3001 || true

      - name: Tear down containers
        if: always()
        run: |
          cd app/infra
          docker-compose down -v
