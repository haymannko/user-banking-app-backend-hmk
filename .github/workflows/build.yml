

name: Build and Test Microservices

on:
  push:
    branches: [ "dev", "feat/*" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ☕ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 🧱 Debug: list structure (helps confirm paths)
      - name: Debug repository structure
        run: |
          pwd
          ls -R app

      # 🧩 Build and install protos module
      - name: Build protos
        working-directory: ./app/infra/protos
        run: mvn clean install -DskipTests

      # 🔧 Build other Maven modules (nickname, gateway, etc.)
      - name: Build all services
        run: |
          mvn -f ./app/nickname-service/pom.xml clean package -DskipTests
          mvn -f ./app/gateway-service/pom.xml clean package -DskipTests

      # 🐳 Build Docker images (correct working directory)
      - name: Build Docker images
        working-directory: ./app/infra
        run: docker compose -f docker-compose.yaml build

      # 🧩 Build & test each microservice
      - name: Build & test nickname-service
        working-directory: app/nickname-service
        run: mvn clean test
      
      - name: Build & test gateway-service
        working-directory: app/gateway-service
        run: mvn clean test
