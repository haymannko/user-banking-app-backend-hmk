


name: Build and Test Microservices

on:
  push:
    branches: [ "dev", "feat/*" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # ☕ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 🧱 Build and install protos module
      - name: Build protos
        working-directory: ./app/infra/protos
        run: |
          mvn clean install -DskipTests

      # 🧩 Build other Maven modules (nickname, gateway, etc.)
      - name: Build all services
        run: |
          mvn -f ./nickname-service/pom.xml clean package -DskipTests
          mvn -f ./gateway-service/pom.xml clean package -DskipTests

      # 🐳 Optional: Build and run docker-compose (integration check)
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build

      # ✅ Optional: Run unit tests if you want
      - name: Run tests
        run: mvn test
